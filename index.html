<script>
(function () {
  'use strict';

  // ===================== TMDB API 配置 =====================
  // 申请 key 步骤：
  //   1) 打开 https://www.themoviedb.org/signup 注册免费账号；
  //   2) 登录后进入「设置(Settings) → API」，申请一个 API Key（v3）；
  //   3) 把下面的 'YOUR_KEY_HERE' 替换成你的 key，然后重新 hexo generate 部署。
  // 注意：纯静态站点会把 key 暴露在页面源码里，仅适合个人低频使用；不要把高权限 key 放进来。
  //       如需更安全，可后续用 Vercel Functions 做一层代理。
  var TMDB_API_KEY = 'YOUR_KEY_HERE';
  var TMDB_IMG = 'https://image.tmdb.org/t/p/w500';

  var LS_OVERRIDES = 'ml-overrides-v2';   // { title: {status, rating} }
  var LS_ADDED     = 'ml-added-v2';       // [item, ...]
  var STATUS = { want: '想看', watching: '在看', watched: '看过' };
  var TYPE = { movie: '电影', tv: '剧集', anime: '动漫', variety: '综艺' };
  var NEXT_STATUS = { want: 'watching', watching: 'watched', watched: 'want' };
  var GRADS = [
    ['#f857a6', '#ff5858'], ['#4facfe', '#00f2fe'], ['#43e97b', '#38f9d7'],
    ['#fa709a', '#fee140'], ['#a18cd1', '#fbc2eb'], ['#30cfd0', '#330867'],
    ['#ff9a9e', '#fecfef'], ['#667eea', '#764ba2'], ['#f093fb', '#f5576c'],
    ['#4e54c8', '#8f94fb'], ['#fc466b', '#3f5efb'], ['#11998e', '#38ef7d']
  ];
  var TAG_COLORS = ['#c9b8ff', '#ff9db4', '#7fd8ea', '#8ff0c4', '#ffd08a', '#ffcf4d', '#9fb6ff', '#f3a6ff', '#86e3ce', '#f5c6a5'];

  var DEFAULT_MARKS = [];

  var app = document.getElementById('marklistApp');
  var state = { status: 'all', type: 'all', query: '', sort: 'default', tag: null };
  var formTags = [];
  var formPoster = '';
  var ioMode = 'export';

  // 一次性迁移旧版(v1)数据到 v2，避免用户已有的标记丢失
  (function migrate() {
    try {
      if (localStorage.getItem(LS_OVERRIDES) === null) {
        var o1 = localStorage.getItem('ml-overrides-v1');
        if (o1 !== null) localStorage.setItem(LS_OVERRIDES, o1);
      }
      if (localStorage.getItem(LS_ADDED) === null) {
        var a1 = localStorage.getItem('ml-added-v1');
        if (a1 !== null) localStorage.setItem(LS_ADDED, a1);
      }
    } catch (e) {}
  })();

  function loadJSON(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); }
    catch (e) { alert('存储失败：可能是 base64 海报过大，超出浏览器 localStorage 限额。建议改用图片 URL。'); }
  }

  var overrides = loadJSON(LS_OVERRIDES, {});
  var added = loadJSON(LS_ADDED, []);

  function getItems() {
    return DEFAULT_MARKS.map(function (m) {
      var o = overrides[m.title] || {};
      return { title: m.title, year: m.year, type: m.type, tags: m.tags || [], note: m.note || '',
               poster: m.poster || '', status: o.status || m.status, rating: (o.rating !== undefined ? o.rating : m.rating) || 0 };
    }).concat(added.map(function (m) {
      return { title: m.title, year: m.year || '', type: m.type, tags: m.tags || [], note: m.note || '',
               poster: m.poster || '', status: m.status, rating: m.rating || 0, added: true };
    }));
  }

  function findAdded(title) { return added.filter(function (a) { return a.title === title; })[0]; }

  function setRating(title, val) {
    var a = findAdded(title);
    if (a) { a.rating = val; saveJSON(LS_ADDED, added); }
    else { if (!overrides[title]) overrides[title] = {}; overrides[title].rating = val; saveJSON(LS_OVERRIDES, overrides); }
    render();
  }
  function cycleStatus(title) {
    var cur = getItems().filter(function (i) { return i.title === title; })[0];
    if (!cur) return;
    var next = NEXT_STATUS[cur.status] || 'want';
    var a = findAdded(title);
    if (a) { a.status = next; saveJSON(LS_ADDED, added); }
    else { if (!overrides[title]) overrides[title] = {}; overrides[title].status = next; saveJSON(LS_OVERRIDES, overrides); }
    render();
  }
  function removeAdded(title) { added = added.filter(function (a) { return a.title !== title; }); saveJSON(LS_ADDED, added); render(); }

  function hash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) >>> 0; }
    return h;
  }
  function posterHTML(item) {
    if (item.poster) return '<img src="' + escapeHtml(item.poster) + '" alt="" loading="lazy">';
    var g = GRADS[hash(item.title) % GRADS.length];
    return '<div class="ml-poster-grad" style="background:linear-gradient(150deg,' + g[0] + ',' + g[1] + ')">' +
           '<span class="ml-poster-char">' + escapeHtml(item.title.charAt(0)) + '</span></div>';
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function highlight(text, q) {
    if (!text) return '';
    if (!q) return escapeHtml(text);
    var lower = text.toLowerCase(), ql = q.toLowerCase();
    if (lower.indexOf(ql) === -1) return escapeHtml(text);
    var out = '', i = 0;
    while (true) {
      var idx = lower.indexOf(ql, i);
      if (idx === -1) { out += escapeHtml(text.slice(i)); break; }
      out += escapeHtml(text.slice(i, idx)) + '<mark class="ml-hl">' + escapeHtml(text.slice(idx, idx + ql.length)) + '</mark>';
      i = idx + ql.length;
      if (i >= text.length) break;
    }
    return out;
  }

  function renderStats() {
    var items = getItems();
    var byStatus = { want: 0, watching: 0, watched: 0 };
    var rated = items.filter(function (i) { return i.rating > 0; });
    var avg = rated.length ? (rated.reduce(function (s, i) { return s + i.rating; }, 0) / rated.length).toFixed(1) : '—';
    items.forEach(function (i) { if (byStatus[i.status] !== undefined) byStatus[i.status]++; });
    document.getElementById('mlStats').innerHTML =
      '<div class="ml-stat s-total"><b>' + items.length + '</b><span>全部作品</span></div>' +
      '<div class="ml-stat s-want"><b>' + byStatus.want + '</b><span>想看</span></div>' +
      '<div class="ml-stat s-watching"><b>' + byStatus.watching + '</b><span>在看</span></div>' +
      '<div class="ml-stat s-watched"><b>' + byStatus.watched + '</b><span>看过</span></div>' +
      '<div class="ml-stat s-rating"><b>' + avg + '</b><span>平均评分</span></div>';
  }

  function renderCloud() {
    var freq = {};
    getItems().forEach(function (i) { (i.tags || []).forEach(function (t) { if (t) freq[t] = (freq[t] || 0) + 1; }); });
    var tags = Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a] || a.localeCompare(b, 'zh'); });
    var wrap = document.getElementById('mlCloudWrap');
    if (!tags.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    document.getElementById('mlCloudCount').textContent = tags.length + ' 个标签';
    var max = freq[tags[0]], min = freq[tags[tags.length - 1]];
    document.getElementById('mlCloud').innerHTML = tags.map(function (t, idx) {
      var size = (min === max) ? 20 : Math.round(12 + (freq[t] - min) / (max - min) * 20);
      var on = state.tag === t ? ' on' : '';
      return '<span class="ml-cloud-tag' + on + '" data-tag="' + escapeHtml(t) + '" style="font-size:' + size + 'px;color:' + TAG_COLORS[idx % TAG_COLORS.length] + '">' + escapeHtml(t) + '</span>';
    }).join('');
  }

  function render() {
    var items = getItems().filter(function (i) {
      if (state.status !== 'all' && i.status !== state.status) return false;
      if (state.type !== 'all' && i.type !== state.type) return false;
      if (state.tag && (i.tags || []).indexOf(state.tag) === -1) return false;
      if (state.query) {
        var q = state.query.toLowerCase();
        var hay = [i.title, String(i.year || ''), TYPE[i.type] || i.type, STATUS[i.status] || i.status,
                   (i.tags || []).join(' '), i.note].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    var sorted = items.slice();
    if (state.sort === 'rating') sorted.sort(function (a, b) { return (b.rating || 0) - (a.rating || 0); });
    else if (state.sort === 'year') sorted.sort(function (a, b) { return (b.year || 0) - (a.year || 0); });
    else if (state.sort === 'title') sorted.sort(function (a, b) { return a.title.localeCompare(b.title, 'zh'); });

    document.getElementById('mlGrid').innerHTML = sorted.map(function (item) {
      var stars = '';
      for (var s = 1; s <= 5; s++) {
        stars += '<span class="ml-star' + (s <= item.rating ? ' on' : '') + '" data-star="' + s + '">★</span>';
      }
      return '' +
        '<div class="ml-card" data-title="' + escapeHtml(item.title) + '">' +
          '<div class="ml-poster">' + posterHTML(item) + '</div>' +
          '<div class="ml-shade"></div>' +
          '<span class="ml-badge ' + item.status + '">' + STATUS[item.status] + '</span>' +
          (item.note ? '<div class="ml-note">' + highlight(item.note, state.query) + '</div>' : '') +
          '<div class="ml-info">' +
            '<h3 class="ml-name" title="' + escapeHtml(item.title) + '">' + highlight(item.title, state.query) + '</h3>' +
            '<div class="ml-meta">' + (item.year || '—') + ' · ' + (TYPE[item.type] || item.type) + '</div>' +
          '</div>' +
          '<div class="ml-actions">' +
            '<span class="ml-stars" title="点击评分">' + stars + '</span>' +
            '<span class="ml-ctl">' +
              (item.added ? '<button class="ml-remove" title="移出清单">✕</button>' :
               '<button class="ml-toggle">' + STATUS[item.status] + ' →</button>') +
            '</span>' +
          '</div>' +
        '</div>';
    }).join('');
    document.getElementById('mlEmpty').style.display = sorted.length ? 'none' : 'block';
    document.getElementById('mlResult').textContent = state.query ? '找到 ' + sorted.length + ' 个结果' : '';
    renderStats();
    renderCloud();
  }

  // ===================== 添加面板 =====================
  function openModal() { document.getElementById('mlModal').classList.add('open'); switchModalTab('manual'); }
  function closeModal() { document.getElementById('mlModal').classList.remove('open'); }
  function switchModalTab(tab) {
    document.getElementById('mlPaneManual').style.display = (tab === 'manual') ? 'block' : 'none';
    document.getElementById('mlPaneSearch').style.display = (tab === 'search') ? 'block' : 'none';
    Array.prototype.forEach.call(document.querySelectorAll('#mlModal .ml-mtab'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-mtab') === tab);
    });
  }
  function resetForm() {
    document.getElementById('mlFTitle').value = '';
    document.getElementById('mlFYear').value = '';
    document.getElementById('mlFType').value = 'movie';
    document.getElementById('mlFStatus').value = 'want';
    document.getElementById('mlFNote').value = '';
    document.getElementById('mlFPosterUrl').value = '';
    document.getElementById('mlPosterHint').textContent = '';
    document.getElementById('mlTmdbQuery').value = '';
    document.getElementById('mlTmdbStatus').textContent = '';
    document.getElementById('mlTmdbResults').innerHTML = '';
    formTags = []; formPoster = '';
    renderTagChips(); updatePosterPreview();
  }
  function renderTagChips() {
    document.getElementById('mlTagChips').innerHTML = formTags.map(function (t, i) {
      return '<span class="ml-tag-chip">' + escapeHtml(t) + '<i class="ml-tagchip-rm" data-i="' + i + '">×</i></span>';
    }).join('');
  }
  function addTag(raw) {
    var t = String(raw || '').trim().replace(/[,，]+$/, '');
    if (!t) { document.getElementById('mlFNewTag').value = ''; return; }
    if (formTags.indexOf(t) === -1) formTags.push(t);
    document.getElementById('mlFNewTag').value = '';
    renderTagChips();
  }
  function removeTag(idx) { formTags.splice(idx, 1); renderTagChips(); }
  function updatePosterPreview() {
    var url = formPoster || document.getElementById('mlFPosterUrl').value.trim();
    document.getElementById('mlPosterPreview').innerHTML = url
      ? '<img src="' + escapeHtml(url) + '" alt="">' : '<div class="ph">🖼</div>';
  }
  function handlePosterFile(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    if (f.type.indexOf('image/') !== 0) { alert('请选择图片文件'); input.value = ''; return; }
    var reader = new FileReader();
    reader.onload = function () {
      formPoster = reader.result;
      document.getElementById('mlFPosterUrl').value = '';
      updatePosterPreview();
      var mb = formPoster.length / 1024 / 1024;
      document.getElementById('mlPosterHint').textContent = mb > 0.4
        ? '提示：此图转 base64 约 ' + mb.toFixed(2) + 'MB，会占用较多本地存储，建议优先用图片 URL。' : '';
    };
    reader.readAsDataURL(f);
    input.value = '';
  }
  function confirmAdd() {
    var title = document.getElementById('mlFTitle').value.trim();
    if (!title) { alert('名称不能为空'); document.getElementById('mlFTitle').focus(); return; }
    var y = parseInt(document.getElementById('mlFYear').value, 10);
    var item = {
      title: title,
      year: isNaN(y) ? '' : y,
      type: document.getElementById('mlFType').value,
      status: document.getElementById('mlFStatus').value,
      rating: 0,
      tags: formTags.slice(),
      note: document.getElementById('mlFNote').value.trim(),
      poster: formPoster || document.getElementById('mlFPosterUrl').value.trim(),
      added: true
    };
    var exist = findAdded(title);
    if (exist) { added[added.indexOf(exist)] = item; } else { added.unshift(item); }
    saveJSON(LS_ADDED, added);
    closeModal(); resetForm(); render();
  }

  // ===================== TMDB 搜索 =====================
  function setTmdbStatus(msg) { document.getElementById('mlTmdbStatus').textContent = msg; }
  function tmdbSearch() {
    var q = document.getElementById('mlTmdbQuery').value.trim();
    if (!q) { setTmdbStatus('请输入片名关键词'); return; }
    if (!TMDB_API_KEY || TMDB_API_KEY === 'YOUR_KEY_HERE') {
      setTmdbStatus('未配置 API Key：请把 mark-list.ejs 顶部的 TMDB_API_KEY 换成你的 key（在 themoviedb.org 注册后到「设置→API」申请）。');
      return;
    }
    setTmdbStatus('搜索中…');
    document.getElementById('mlTmdbResults').innerHTML = '';
    var url = 'https://api.themoviedb.org/3/search/multi?api_key=' + encodeURIComponent(TMDB_API_KEY) +
              '&query=' + encodeURIComponent(q) + '&language=zh-CN&page=1&include_adult=false';
    fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        var list = (data.results || []).filter(function (r) { return r.media_type === 'movie' || r.media_type === 'tv'; });
        if (!list.length) { setTmdbStatus('无结果，换个关键词试试。'); return; }
        setTmdbStatus('找到 ' + list.length + ' 个结果，点击任意一项填充表单');
        renderTmdb(list);
      })
      .catch(function () { setTmdbStatus('搜索失败，请检查网络或 API Key。'); });
  }
  function renderTmdb(list) {
    document.getElementById('mlTmdbResults').innerHTML = list.map(function (r) {
      var year = (r.media_type === 'movie') ? (r.release_date || '').slice(0, 4) : (r.first_air_date || '').slice(0, 4);
      var poster = r.poster_path ? TMDB_IMG + r.poster_path : '';
      var name = r.title || r.name || '';
      var typeLabel = r.media_type === 'movie' ? '电影' : '剧集';
      var img = poster ? '<img src="' + escapeHtml(poster) + '" loading="lazy" alt="">'
                       : '<div class="ml-tmdb-noimg">' + escapeHtml(name.charAt(0)) + '</div>';
      return '<div class="ml-tmdb-item" data-mtype="' + r.media_type + '" data-year="' + year + '" data-poster="' + escapeHtml(poster) + '" data-title="' + escapeHtml(name) + '" data-overview="' + escapeHtml(r.overview || '') + '">' +
        img +
        '<div class="ml-tmdb-meta"><span class="ml-tmdb-name">' + escapeHtml(name) + '</span><span class="ml-tmdb-sub">' + (year || '—') + ' · ' + typeLabel + '</span></div>' +
      '</div>';
    }).join('');
  }
  function fillFromTmdb(el) {
    document.getElementById('mlFTitle').value = el.getAttribute('data-title') || '';
    document.getElementById('mlFYear').value = el.getAttribute('data-year') || '';
    document.getElementById('mlFType').value = el.getAttribute('data-mtype') === 'tv' ? 'tv' : 'movie';
    document.getElementById('mlFNote').value = el.getAttribute('data-overview') || '';
    formPoster = el.getAttribute('data-poster') || '';
    document.getElementById('mlFPosterUrl').value = formPoster;
    updatePosterPreview();
    switchModalTab('manual');
    document.getElementById('mlFStatus').focus();
  }

  // ===================== 导入 / 导出 =====================
  function yamlStr(v) {
    return '"' + String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
  }
  function itemsToYAML(items) {
    return items.map(function (it) {
      var lines = ['- title: ' + yamlStr(it.title)];
      if (it.year) lines.push('  year: ' + it.year);
      if (it.type) lines.push('  type: ' + it.type);
      if (it.status) lines.push('  status: ' + it.status);
      if (typeof it.rating === 'number') lines.push('  rating: ' + it.rating);
      if (it.tags && it.tags.length) lines.push('  tags: [' + it.tags.map(yamlStr).join(', ') + ']');
      if (it.note) lines.push('  note: ' + yamlStr(it.note));
      if (it.poster) lines.push('  poster: ' + yamlStr(it.poster));
      return lines.join('\n');
    }).join('\n');
  }
  function parseYAML(text) {
    var items = [], cur = null;
    function unquote(s) {
      s = s.trim();
      if (s.length >= 2 && s.charAt(0) === '"' && s.charAt(s.length - 1) === '"') {
        try { return JSON.parse(s); } catch (e) { return s.slice(1, -1); }
      }
      return s;
    }
    function setKV(obj, kv) {
      var idx = kv.indexOf(':');
      if (idx < 0) return;
      var k = kv.slice(0, idx).trim();
      var v = kv.slice(idx + 1).trim();
      if (k === 'tags') {
        v = v.replace(/^\[/, '').replace(/\]\s*$/, '');
        obj.tags = v ? v.split(',').map(function (s) { return unquote(s); }) : [];
      } else if (k === 'year' || k === 'rating') {
        var n = parseInt(v, 10); obj[k] = isNaN(n) ? v : n;
      } else {
        obj[k] = unquote(v);
      }
    }
    text.split(/\r?\n/).forEach(function (line) {
      var t = line.trim();
      if (!t || t.charAt(0) === '#') return;
      if (t.charAt(0) === '-') {
        cur = {}; items.push(cur);
        t = t.replace(/^-/, '').trim();
        if (t) setKV(cur, t);
      } else if (cur) {
        setKV(cur, t);
      }
    });
    return items.filter(function (o) { return o && o.title; });
  }
  function importItems(items) {
    var n = 0;
    items.forEach(function (it) {
      if (!it.title) return;
      var def = DEFAULT_MARKS.filter(function (d) { return d.title === it.title; })[0];
      if (def) {
        if (!overrides[it.title]) overrides[it.title] = {};
        if (it.status) overrides[it.title].status = it.status;
        if (typeof it.rating === 'number') overrides[it.title].rating = it.rating;
        n++;
      } else {
        var a = findAdded(it.title);
        var obj = { title: it.title, year: it.year || '', type: it.type || 'movie', status: it.status || 'want',
                    rating: it.rating || 0, tags: it.tags || [], note: it.note || '', poster: it.poster || '', added: true };
        if (a) { added[added.indexOf(a)] = obj; } else { added.unshift(obj); }
        n++;
      }
    });
    saveJSON(LS_OVERRIDES, overrides); saveJSON(LS_ADDED, added);
    return n;
  }
  function openIOModal(mode) {
    ioMode = mode;
    var ta = document.getElementById('mlIOText');
    if (mode === 'export') {
      document.getElementById('mlIOTitle').textContent = '导出数据（YAML）';
      document.getElementById('mlIOHint').textContent = '以下是当前清单的 YAML，可复制后粘贴到 source/_data/marks.yml，再重新 hexo generate 部署。若海报是 base64 上传的，会生成很长的字符串，建议改用图片 URL。';
      document.getElementById('mlIOAction').textContent = '复制';
      ta.value = itemsToYAML(getItems());
    } else {
      document.getElementById('mlIOTitle').textContent = '导入数据（YAML / JSON）';
      document.getElementById('mlIOHint').textContent = '粘贴 YAML（与 marks.yml 同格式）或 JSON 数组，将合并到本地。同名条目会覆盖本地/更新默认项的状态与评分。';
      document.getElementById('mlIOAction').textContent = '导入并合并';
      ta.value = '';
    }
    document.getElementById('mlIOModal').classList.add('open');
  }
  function closeIOModal() { document.getElementById('mlIOModal').classList.remove('open'); }
  function copyText(t) {
    function fallback() {
      var ta = document.getElementById('mlIOText'); ta.focus(); ta.select();
      try { document.execCommand('copy'); alert('已复制到剪贴板'); } catch (e) { alert('复制失败，请手动全选复制'); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { alert('已复制到剪贴板'); }, fallback);
    } else fallback();
  }
  function ioAction() {
    var ta = document.getElementById('mlIOText');
    if (ioMode === 'export') { copyText(ta.value); return; }
    var text = ta.value.trim();
    if (!text) { alert('请先粘贴 YAML 或 JSON 数据'); return; }
    var items = [];
    if (text.charAt(0) === '[' || text.charAt(0) === '{') {
      try { var j = JSON.parse(text); items = Array.isArray(j) ? j : (j && Array.isArray(j.marks) ? j.marks : []); }
      catch (e) { alert('JSON 解析失败，请检查格式'); return; }
    } else {
      items = parseYAML(text);
    }
    if (!items.length) { alert('未能解析出任何条目，请检查格式'); return; }
    var n = importItems(items);
    closeIOModal();
    alert('已导入 ' + n + ' 个条目');
    render();
  }

  // ===================== 事件：主区域 =====================
  app.addEventListener('click', function (e) {
    var t = e.target;
    if (t.classList.contains('ml-tab')) {
      app.querySelectorAll('.ml-tab').forEach(function (b) { b.classList.remove('active'); });
      t.classList.add('active'); state.status = t.getAttribute('data-status'); render();
    } else if (t.classList.contains('ml-chip')) {
      app.querySelectorAll('.ml-chip').forEach(function (b) { b.classList.remove('active'); });
      t.classList.add('active'); state.type = t.getAttribute('data-type'); render();
    } else if (t.classList.contains('ml-cloud-tag')) {
      var tag = t.getAttribute('data-tag');
      state.tag = (state.tag === tag) ? null : tag; render();
    } else if (t.classList.contains('ml-star')) {
      var card = t.closest('.ml-card'); var title = card.getAttribute('data-title');
      var star = +t.getAttribute('data-star');
      var cur = getItems().filter(function (i) { return i.title === title; })[0];
      setRating(title, (cur && cur.rating === star) ? 0 : star);
    } else if (t.classList.contains('ml-toggle')) {
      cycleStatus(t.closest('.ml-card').getAttribute('data-title'));
    } else if (t.classList.contains('ml-remove')) {
      removeAdded(t.closest('.ml-card').getAttribute('data-title'));
    } else if (t.id === 'mlReset') {
      overrides = {}; added = [];
      localStorage.removeItem(LS_OVERRIDES); localStorage.removeItem(LS_ADDED);
      state.tag = null; render();
    } else if (t.id === 'mlAddBtn') {
      openModal();
    } else if (t.id === 'mlExport') {
      openIOModal('export');
    } else if (t.id === 'mlImport') {
      openIOModal('import');
    }
  });

  var searchTimer = null;
  app.addEventListener('input', function (e) {
    if (e.target.id === 'mlSearch') {
      var v = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { state.query = v; render(); }, 150);
    }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'mlSort') { state.sort = e.target.value; render(); }
  });

  // ===================== 事件：弹窗（已挂到 body） =====================
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest && t.closest('[data-close]')) { closeModal(); closeIOModal(); return; }
    if (t.classList && t.classList.contains('ml-mtab')) { switchModalTab(t.getAttribute('data-mtab')); return; }
    if (t.classList && t.classList.contains('ml-tagchip-rm')) { removeTag(+t.getAttribute('data-i')); return; }
    if (t.id === 'mlConfirm') { confirmAdd(); return; }
    if (t.id === 'mlCancel') { closeModal(); return; }
    if (t.id === 'mlTmdbBtn') { tmdbSearch(); return; }
    if (t.classList && t.classList.contains('ml-tmdb-item')) { fillFromTmdb(t); return; }
    if (t.id === 'mlIOAction') { ioAction(); return; }
    if (t.id === 'mlPosterUpload') { document.getElementById('mlPosterFile').click(); return; }
    if (t.id === 'mlPosterClear') { formPoster = ''; document.getElementById('mlFPosterUrl').value = ''; document.getElementById('mlPosterHint').textContent = ''; updatePosterPreview(); return; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'mlFNewTag') {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(e.target.value); }
    } else if (e.target && e.target.id === 'mlTmdbQuery') {
      if (e.key === 'Enter') { e.preventDefault(); tmdbSearch(); }
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'mlPosterFile') { handlePosterFile(e.target); }
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'mlFPosterUrl') { updatePosterPreview(); }
  });

  // 把弹窗移到 body，避免被主题祖先元素的 transform/overflow 影响定位
  document.body.appendChild(document.getElementById('mlModal'));
  document.body.appendChild(document.getElementById('mlIOModal'));

  // 先渲染空壳，再异步加载数据后重绘
  render();

  fetch('/marks.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) { if (Array.isArray(data)) DEFAULT_MARKS = data; })
    .catch(function () { DEFAULT_MARKS = []; })
    .then(function () { render(); });
})();
