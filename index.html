  var LS_OVERRIDES = 'ml-overrides-v1';   // { title: {status, rating} }

            '<span class="ml-badge ' + item.status + '">' + STATUS[item.status] + '</span>' +
          '</div>' +
          '<div class="ml-card-body">' +
            '<h3 class="ml-name" title="' + escapeHtml(item.title) + '">' + escapeHtml(item.title) + '</h3>' +
            '<div class="ml-meta">' + (item.year || '—') + ' · ' + (TYPE[item.type] || item.type) + '</div>' +
            '<div class="ml-tags">' + tags + '</div>' +
            (item.note ? '<div class="ml-note">' + escapeHtml(item.note) + '</div>' : '') +
            '<div class="ml-actions">' +
              '<span class="ml-stars" title="点击评分">' + stars + '</span>' +
              (item.added ? '<button class="ml-remove" title="移出清单">✕</button>' :
               '<button class="ml-toggle">' + STATUS[item.status] + ' →</button>') +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');
    document.getElementById('mlEmpty').style.display = sorted.length ? 'none' : 'block';
    renderStats();
  }

  // 事件绑定（事件委托）
  app.addEventListener('click', function (e) {
    var t = e.target;
    if (t.classList.contains('ml-tab')) {
      app.querySelectorAll('.ml-tab').forEach(function (b) { b.classList.remove('active'); });
      t.classList.add('active'); state.status = t.getAttribute('data-status'); render();
    } else if (t.classList.contains('ml-chip')) {
      app.querySelectorAll('.ml-chip').forEach(function (b) { b.classList.remove('active'); });
      t.classList.add('active'); state.type = t.getAttribute('data-type'); render();
    } else if (t.classList.contains('ml-star')) {
      var card = t.closest('.ml-card'); var title = card.getAttribute('data-title'); var star = +t.getAttribute('data-star');
      if (!overrides[title]) overrides[title] = {};
      overrides[title].rating = (overrides[title].rating === star) ? 0 : star;
      saveJSON(LS_OVERRIDES, overrides); render();
    } else if (t.classList.contains('ml-toggle')) {
      var card2 = t.closest('.ml-card'); var title2 = card2.getAttribute('data-title');
      var item = getItems().filter(function (i) { return i.title === title2; })[0];
      if (!overrides[title2]) overrides[title2] = {};
      overrides[title2].status = NEXT_STATUS[item.status];
      saveJSON(LS_OVERRIDES, overrides); render();
    } else if (t.classList.contains('ml-remove')) {
      var card3 = t.closest('.ml-card'); var title3 = card3.getAttribute('data-title');
      added = added.filter(function (i) { return i.title !== title3; });
      saveJSON(LS_ADDED, added); render();
    } else if (t.id === 'mlReset') {
      overrides = {}; added = [];
      localStorage.removeItem(LS_OVERRIDES); localStorage.removeItem(LS_ADDED);
      render();
    } else if (t.id === 'mlAddBtn') {
      addItem();
    }
  });

  app.addEventListener('input', function (e) {
    if (e.target.id === 'mlSearch') { state.query = e.target.value; render(); }
  });

  app.addEventListener('change', function (e) {
    if (e.target.id === 'mlSort') { state.sort = e.target.value; render(); }
  });

  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'mlAddTitle') addItem();
  });

  function addItem() {
    var title = document.getElementById('mlAddTitle').value.trim();
    if (!title) { document.getElementById('mlAddTitle').focus(); return; }
    var type = document.getElementById('mlAddType').value;
    var status = document.getElementById('mlAddStatus').value;
    added.unshift({ title: title, year: '', type: type, tags: [], note: '手动添加', status: status, rating: 0 });
    saveJSON(LS_ADDED, added);
    document.getElementById('mlAddTitle').value = '';
    render();
  }

  render();
})();
</script>
